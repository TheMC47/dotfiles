set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

################# Keys

# Set the default command key to C-a.
unbind C-b
set -g prefix C-Space
bind C-a send-prefix

# Enable mouse support.
set-option -g mouse on

# Start index of window/pane with 1
set -g base-index 1
setw -g pane-base-index 1

# Close a gap in the middle: keep indexes contiguous so a new window is always far right
set -g renumber-windows on

# Keep #W under our control: programs can't rename via the ESC k sequence, and
# the name tracks the directory (claude reports its version as the command name,
# which makes a useless "2.1.220" label).
set -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'

# Reload the config
bind r source-file ~/.config/tmux/tmux.conf

set-window-option -g mode-keys vi
bind-key v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Navigation
bind -n M-H previous-window
bind -n M-J previous-window
bind -n M-L next-window
bind -n M-K next-window

################# Visuals

# Copy mode style
setw -g mode-style 'fg=colour1 bg=colour18 bold'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour1'
set -g status-right ''
set -g status-left-length 10

setw -g window-status-current-style 'fg=colour0 bg=colour2 bold'
setw -g window-status-current-format ' #I #W #F '
setw -g window-status-style 'fg=colour1 dim'
setw -g window-status-format ' #I #[fg=colour7]#W #[fg=colour1]#F '
set -g visual-bell off

set -g @catppuccin_window_status_icon_enable "yes"
set -g @catppuccin_icon_window_bell "!!"

# Catppuccin labels windows with #T (pane title). Claude sets a useful title while
# running but clears it on exit, which left the label blank -- fall back to #W then.
set -g @catppuccin_window_text " #{?#{==:#T,},#W,#T}"
set -g @catppuccin_window_current_text " #{?#{==:#T,},#W,#T}"

set -g @catppuccin_flavour 'frappe'

run '~/.config/tmux/plugins/tpm/tpm'
