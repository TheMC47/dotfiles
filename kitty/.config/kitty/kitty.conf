# Ported from alacritty.toml

# Font (alacritty: FiraCode Nerd Font Mono, style Retina, size 12)
font_family      family="FiraCode Nerd Font Mono" style="Retina"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# Window (alacritty: opacity = 1)
background_opacity 1.0

# macOS: treat the Option key as Alt/Meta so tmux/vim M-... bindings work
# (e.g. the M-H/M-L window navigation). With kanata, "Option" = holding `d`.
macos_option_as_alt yes

# Config reload (alacritty: live_config_reload = true)
# Kitty has no file-watcher, but reloads on demand with the built-in
# cmd+ctrl+, (macOS) or ctrl+shift+f5.

# Theme (alacritty imported catppuccin-mocha.toml)
include catppuccin-mocha.conf
